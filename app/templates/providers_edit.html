<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Provider</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #f2f5fb;
      --ink: #0e1726;
      --accent: #3a6ee8;
      --accent-2: #7c3aed;
      --card: #ffffff;
      --muted: #5a6472;
      --line: #e2e8f0;
    }
    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI Variable", "Segoe UI", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, #ffffff, transparent 40%),
        radial-gradient(circle at 90% 0%, #dbeafe, transparent 40%),
        linear-gradient(180deg, #f7f8fc, var(--bg));
      color: var(--ink);
    }
    .wrap {
      max-width: 900px;
      margin: 56px auto;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }
    label {
      font-size: 13px;
      color: var(--muted);
    }
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 14px;
      color: var(--ink);
    }
    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.25);
    }
    button.ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      box-shadow: none;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #2e6f4e;
    }
    a.link {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div style="display:flex; justify-content: space-between; align-items:center; gap:12px;">
        <div>
          <h1>Provider</h1>
          <div class="muted">API keys are encrypted and never shown.</div>
        </div>
        <div>
          <a class="link" href="/providers">Back to Providers</a>
        </div>
      </div>

      <form id="provider-form" method="post">
        <div class="field">
          <label for="provider_key">Name</label>
          <input id="provider_key" type="text" name="provider_key" value="{{ provider.provider_key }}" {% if provider.provider_key %}readonly{% endif %} required />
        </div>
        <div class="field">
          <label for="enabled">Enabled</label>
          <select id="enabled" name="enabled">
            <option value="true" {% if provider.enabled %}selected{% endif %}>true</option>
            <option value="false" {% if not provider.enabled %}selected{% endif %}>false</option>
          </select>
        </div>
        <div class="field">
          <label for="base_url">Base URL</label>
          <input id="base_url" type="text" name="base_url" value="{{ provider.base_url }}" />
        </div>
        <div class="field">
          <label for="model">Model</label>
          <input id="model" type="text" name="model" value="{{ provider.model }}" />
        </div>
        <div class="field">
          <label for="input_per_1m">Input $/1M</label>
          <input id="input_per_1m" type="number" step="0.0001" name="input_per_1m" value="{{ provider.input_per_1m }}" />
        </div>
        <div class="field">
          <label for="output_per_1m">Output $/1M</label>
          <input id="output_per_1m" type="number" step="0.0001" name="output_per_1m" value="{{ provider.output_per_1m }}" />
        </div>
        <div class="actions">
          <button type="submit">Save Provider</button>
        </div>
        <div id="status" class="status"></div>
      </form>

      <form id="key-form" method="post" style="margin-top: 24px;" {% if not provider.provider_key %}hidden{% endif %}>
        <h3 id="key" style="margin: 0 0 8px;">Update API Key</h3>
        <div class="field">
          <label for="api_key">API Key</label>
          <input id="api_key" type="text" name="api_key" placeholder="Enter new key" />
        </div>
        <div class="actions">
          <button type="submit" class="ghost">Update Key</button>
        </div>
        <div id="key_status" class="status"></div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("provider-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const statusEl = document.getElementById("status");
      statusEl.textContent = "";
      const formData = new FormData(event.target);
      const response = await fetch("/providers/save", {
        method: "POST",
        body: formData
      });
      if (!response.ok) {
        statusEl.textContent = `Save failed: ${await response.text()}`;
        statusEl.style.color = "#9e2a2b";
        return;
      }
      statusEl.textContent = "Saved.";
      statusEl.style.color = "#2e6f4e";
      if (!document.getElementById("provider_key").readOnly) {
        window.location.href = `/providers/edit?provider=${encodeURIComponent(formData.get("provider_key"))}`;
      }
    });

    const keyForm = document.getElementById("key-form");
    if (keyForm) {
      keyForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const statusEl = document.getElementById("key_status");
        statusEl.textContent = "";
        const formData = new FormData(event.target);
        formData.set("provider_key", document.getElementById("provider_key").value);
        const response = await fetch("/providers/key", {
          method: "POST",
          body: formData
        });
        if (!response.ok) {
          statusEl.textContent = `Update failed: ${await response.text()}`;
          statusEl.style.color = "#9e2a2b";
          return;
        }
        statusEl.textContent = "Updated key.";
        statusEl.style.color = "#2e6f4e";
        document.getElementById("api_key").value = "";
      });
    }
  </script>
</body>
</html>
