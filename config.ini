[server]
host = 0.0.0.0
port = 444
use_https = true
cert_path = https-certs/tls.cert.pem
key_path = https-certs/tls.key.pem
debug = true

[database]
path = db/report_overrides.db

[ai_sections]

[ai_sections.openai]
enabled = true
api_key = 
base_url = https://api.openai.com/v1/your-endpoint
model = gpt-4o-mini
input_per_1m = 0.15
output_per_1m = 0.60

[ai_sections.grok]
enabled = false
api_key = 
base_url = https://api.x.ai/your-endpoint
model = grok-1
input_per_1m = 0
output_per_1m = 0

[ai_sections.claude]
enabled = false
api_key = 
base_url = https://api.anthropic.com/your-endpoint
model = claude-3
input_per_1m = 3.00
output_per_1m = 15.00

[ai_sections.gemini]
enabled = false
api_key = 
base_url = https://generativelanguage.googleapis.com/your-endpoint
model = gemini-1.5
input_per_1m = 0.30
output_per_1m = 2.50

[reports]

[reports.queues_statistics]
version = 1.0
pdf_engine = reportlab
report_mode = local
overview_text = Ethernet Layer 2 queue loss analysis summary
name = Queues Statistics
description = Queues statistics report for packet discard and throughput behavior.
prompt = You are a data analyst. Provide concise insights based on the CSV summary, queue statistics, and sample rows. Focus on abnormal or unique behavior, outliers, missing data, time patterns, and potential operational implications. Return plain text with short paragraphs. Summary: {summary} Queue Statistics: {queue_stats} Sample rows: {sample_rows}
sample_rows = 5
delimiter = ###
preview_rows = 15
override_name = 

[reports.queues_statistics_2]
version = 1.0
pdf_engine = reportlab
report_mode = local
overview_text = Ethernet Layer 2 queue loss analysis summary 2
name = Queues Statistics 2
description = Queues statistics report for packet discard and throughput behavior.
prompt = You are a data analyst. Provide concise insights based on the CSV summary, queue statistics, and sample rows. Focus on abnormal or unique behavior, outliers, missing data, time patterns, and potential operational implications. Return plain text with short paragraphs. Summary: {summary} Queue Statistics: {queue_stats} Sample rows: {sample_rows}
sample_rows = 5
delimiter = ###
preview_rows = 15
override_name = 

[reports.twamp_statistics]
version = 1.0
pdf_engine = reportlab
report_mode = local
overview_text = ETX-2i TWAMP and policing performance snapshot
name = TWAMP Statistics
description = TWAMP and color policing statistics report for service performance.
prompt = You are a data analyst. Provide concise insights for TWAMP and policing metrics using the summary, analysis data, and sample rows. Focus on TWAMP activity, discard rates, yellow traffic, microburst indicators, time patterns, and operational implications. Format output as sections. Start each section with '{delimiter} ' followed by the title on the same line. Summary: {summary} Analysis: {analysis} Sample rows: {sample_rows}
sample_rows = 5
delimiter = ###
preview_rows = 15
override_name = 

[reports.snmp_performance]
version = 1.0
pdf_engine = reportlab
report_mode = local
overview_text = ETX-2i SNMP performance and microburst summary
name = SNMP Performance
description = SNMP performance report with service stats and microburst indicators.
prompt = You are a data analyst. Provide concise insights for SNMP performance using the summary, analysis data, and sample rows. Focus on discard rates, yellow traffic, microburst stress, TWAMP activity, time patterns, and operational implications. Format output as sections. Start each section with '{delimiter} ' followed by the title on the same line. Summary: {summary} Analysis: {analysis} Sample rows: {sample_rows}
sample_rows = 5
delimiter = ###
preview_rows = 15
override_name = 

[analysis]
abnormal_drop_rate_threshold = 0.05
top_n_queues = 15
time_bucket_minutes = 15
include_trend_chart = true
enable_outliers = true
enable_percentiles = true
enable_correlations = true
enable_conclusion = true
enable_recommendations = true
outlier_method = iqr
per_queue_timeseries = false
severity_thresholds = 0.05,0.2,0.5

