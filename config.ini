[server]
host = 0.0.0.0
port = 444
use_https = true
cert_path = https-certs/tls.cert.pem
key_path = https-certs/tls.key.pem

[openai]
api_key = YOUR_OPENAI_TOKEN
model = gpt-4o-mini

[secondary_ai]
api_key = YOUR_SECONDARY_TOKEN
base_url = https://api.vendor.com/report
model = vendor-model-name

[report]
pdf_engine = reportlab
report_type = queues_statistics
report_mode = local
